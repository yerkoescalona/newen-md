# Expected output from the released gromosXX binary with @develop: gromosXX marks Ewald as
# under development (`in_parameter.cc:4672`, "Ewald sum is under development"), so
# scripts/regen_gromosXX_references.py (which passes no extra flag) cannot regenerate it.
# Generated by hand, in an empty directory, with
#   .local/gromosXX/md++/BUILD/program/md @topo ../water_216_box/water_216_box.topo \
#     @conf ../water_216_box/water_216_box.conf @input water_216_box_ewald.in @fin final.conf \
#     @tre energies.tre @trf forces.trf @trc trajectory.trc @develop
# and the four output files copied into expected/.
# gromosXX v1.6.0, double precision, 648 atoms. KCUT = 900 nm^-2 is compared with |k|^2
# (as gromosXX does): with NKX = NKY = NKZ = 10 it keeps the l inside a sphere of radius
# 30 L / (2 pi) (9.5 for L = 2.0 nm, 8.9 for L = 1.8652 nm), where exp(-a^2 k^2 / 4) < 3e-16.

[system]
name = "water_216_box_ewald"
description = "Level 3: 216 waters bulk, direct Ewald sum (NLRELE 2)"
level = 3
natoms = 648
isolates = "Ewald: k space, real space, excluded pairs, twin-range LJ-only shell, self/A terms (cubic A2), EPSLS 0"

[input]
topology = "../water_216_box/water_216_box.topo"
configuration = "../water_216_box/water_216_box.conf"
parameters = "water_216_box_ewald.in"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[precision]
internal = "f64"
position_digits = 9
force_digits = 9
energy_sigfigs = 10

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
