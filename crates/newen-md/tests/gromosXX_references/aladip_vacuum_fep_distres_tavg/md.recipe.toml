# Effective run recipe written by newen md
# NOTE: PRESSURESCALE block absent: no pressure coupling
# NOTE: ENERGYMIN block absent: dynamics, not minimisation
version = 1
title = "Alanine dipeptide vacuum FEP at RLAM=0.125, two energy groups, time-averaged distance restraints (NTDIR -2, TAUDIR 0.1)"

[system]
npm = 1
nsm = 0

[control]
steps = 10
t0 = 0.0
dt = 0.002
seed = 210185
generate_velocities = false
initial_temperature = 0.0
initial_shake = 0
ntinht = 0
ntinhb = 0
ntishi = 1
ntirtc = 0
ntisti = 0

[control.com_motion]
initial = 0
every = 100000

[boundary]
kind = "vacuum"
ndfmin = 0

[forcefield]
bonds = true
angles = true
impropers = true
dihedrals = true
charges = true
nonbonded = true
terms = []

[forcefield.covalent_form]
harmonic_bonds = false
harmonic_angles = false
limited_phase_shifts = false

[forcefield.energy_groups]
count = 2
last_atoms = [
    6,
    12,
]

[forcefield.pairlist]
algorithm = "standard"
every = 1
cutoff_short = 0.8
cutoff_long = 1.4
grid_size = 0.0
kind = "charge_group"

[forcefield.electrostatics]
electrostatics = 1
kappa = 0.0
rf_cutoff = 1.4
epsilon_rf = 62.0
self_exclusion = 1
pme_order = 4
pme_alpha = 0.0

[forcefield.electrostatics.lattice_sum]
nshape = -1
ashape = 1.4
na2clc = 2
tola2 = 0.0000000001
epsls = 0.0
nk = [
    10,
    10,
    10,
]
nk2 = 100.0
ng = [
    32,
    32,
    32,
]
nasord = 3
nfdord = 2
nalias = 3
nspord = 4
nqeval = 100000
faccur = 1.6
nrdgrd = 0
nwrgdr = 0
nlrlj = 0
slvdns = 33.3

[forcefield.restraints.position]
mode = 0
reference = 0
scaling = 0
k = 0.0

[forcefield.restraints.distance]
mode = -2
ntdira = 0
k = 1000.0
r_linear = 0.3
tau = 0.1
forcescale = 0
vdir = 0
write_every = 0

[constraints]
solute = "none"
solute_algorithm = "shake"
shake_tolerance = 0.0001
lincs_order_solute = 4
solvent_algorithm = "shake"
solvent_shake_tolerance = 0.0001
lincs_order_solvent = 4

[ensemble.thermostat]
algorithm = "berendsen"
dof_sets = [[
    12,
    1,
    1,
]]

[[ensemble.thermostat.baths]]
temperature = 300.0
tau = -1.0

[minimisation]
method = 0
cycles = 0
tolerance = 0.1
step0 = 0.01
step_max = 0.05
min_steps = 1
force_limit = 0.0

[perturbation]
enabled = 1
nrdgl = 0
lambda = 0.125
dlamt = 0.0
alpha_lj = 0.3
alpha_c = 0.6
nlam = 1
nscale = 0

[outputs]
trajectory_every = 1
ntwse = 0
velocities_every = 0
forces_every = 1
energy_every = 1
ntwg = 1
ntwb = 0
print_every = 1
ntpp = 0
energy_special = false

[execution]
parallel = "auto"

[inputs]
pttopo = "../shared/aladip.pttopo"
distrest = "../shared/check/aladip.distrest"

[passthrough]
