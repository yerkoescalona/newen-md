# gromosXX md++ 2023-04-15 (native binary), item 1.8
[system]
name = "aladip_vacuum_fep_distres_tavg"
description = "aladip vacuum FEP with time-averaged perturbed and unperturbed distance restraints"
level = 4
isolates = "the r^-3 running average of the restrained distance in energy, force and dH/dlambda"

[input]
distrest = "../shared/check/aladip.distrest"
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_fep_distres_tavg.in"
pttopo = "../shared/aladip.pttopo"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"
free_energy = "expected/free_energy.trg"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
