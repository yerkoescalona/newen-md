# gromosXX md++ 2023-04-15 (native binary), item 1.8
[system]
name = "aladip_vacuum_fep_groups"
description = "aladip vacuum FEP with two energy groups and a .trg every step"
level = 4
isolates = "per-group bonded/nonbonded energies and dH/dlambda per term, kinetic dH/dlambda of perturbed masses"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_fep_groups.in"
pttopo = "../shared/aladip.pttopo"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"
free_energy = "expected/free_energy.trg"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
