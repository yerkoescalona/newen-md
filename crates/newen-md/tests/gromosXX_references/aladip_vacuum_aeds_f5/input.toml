# gromosXX md++ 247c95c4 (native binary .local/gromosXX/md++/BUILD/program/md), item 1.8
[system]
name = "aladip_vacuum_aeds_f5"
description = "aladip vacuum, A-EDS FORM 5 (E_max/E_min search, prevalence-driven offsets with step ASTEPS*dt) over three end states of N and H (aladip_aeds3.mpt), EIR 0 0 -3, 250 steps from Maxwell-Boltzmann velocities"
level = 4
isolates = "A-EDS parameter search: slots 34-39, the offsets every frame (written after the update) and the final AEDSSEARCH block"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_aeds_f5.in"
pttopo = "../shared/aladip_aeds3.mpt"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9

# Recipe fields no .imd block carries, applied by the runners (md @recipe_set key=value,
# Recipe.update in Python): reproduce gromosXX 247c95c4, whose defects this native
# reference pins: the columns after the update (D16), plain-exponential prevalences (D25), state 1 as the default target (D32).
[recipe_overrides]
"aeds.energy_columns" = "gromosxx-post-update"
"aeds.prevalence" = "gromosxx-plain-exp"
"aeds.target_state" = "gromosxx-state1-default"
