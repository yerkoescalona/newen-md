# Expected output from native gromosXX 247c95c4 + `patches/LS2_surface_virial.patch` (built as in
# `patches/BUILD.md`), with @develop (gromosXX marks Ewald as under development,
# `in_parameter.cc:4672`), so scripts/regen_gromosXX_references.py cannot regenerate it.
# Generated by hand, in an empty directory, with
#   <patched md> @topo ../water_216_box/water_216_box.topo \
#     @conf ../water_216_box/water_216_box.conf @input water_216_npt_ewald_epsls_fixed.in \
#     @fin final.conf @tre energies.tre @trf forces.trf @trc trajectory.trc @develop
# and the four output files copied into expected/.
# gromosXX v1.6.0, double precision, 648 atoms. `water_216_box_ewald_epsls` (Ewald, EPSLS 61,
# atomic cutoff) with `water_216_npt`'s Berendsen thermostat and barostat. The released binary
# adds the surface virial Xi (diagonal only) where every other lattice-sum term adds -2 Xi
# (`nonbonded_outerloop.cc:2676-2686`); the patch adds -2 Xi with the full tensor, so the
# pressure, and with it the box and every later step, differ from the released binary.

[system]
name = "water_216_npt_ewald_epsls_fixed"
description = "Level 3: 216 waters NPT, Ewald (NLRELE 2) with EPSLS 61"
level = 3
natoms = 648
isolates = "surface-term virial under pressure coupling (LS2)"

[input]
topology = "../water_216_box/water_216_box.topo"
configuration = "../water_216_box/water_216_box.conf"
parameters = "water_216_npt_ewald_epsls_fixed.in"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[precision]
internal = "f64"
position_digits = 9
force_digits = 9
energy_sigfigs = 10

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
