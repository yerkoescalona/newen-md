# Reference for a GROMOS input style the original suite did not cover
# (see crates/newen-md/tests/gromosXX_references/README-livecoms.md).
# gromosXX v1.6.0, double precision, 72 atoms

[system]
name = "aladip_wrapped"
description = "Aladip + 20 SPC with the solute split across the periodic boundary, all bonds constrained"
level = 5
natoms = 72
isolates = "minimum image in the bonded terms and in SHAKE; charge groups put back into the box"

[input]
topology = "../shared/aladip.topo"
configuration = "aladip_wrapped.conf"
parameters = "aladip_wrapped.in"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
