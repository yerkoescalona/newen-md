# gromosXX md++ 247c95c4 (native binary .local/gromosXX/md++/BUILD/program/md), item 1.8
[system]
name = "aladip_vacuum_eds_pairs"
description = "aladip vacuum, EDS FORM 3 over three end states, released gromosXX: end-state energies and V_R only"
level = 4
isolates = "EDS pair-s end-state energies and V_R (right in the released binary) at frame 0"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_eds_pairs.in"
pttopo = "../shared/aladip_eds3.mpt"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"
# The released gromosXX's FORM 3 force weights are defective (zero-seeded log-sum-exp,
# missing "- max"; patches/D2_eds_weights.patch), so its forces and trajectory are
# not compared: only the end-state energies (the `# eds` rows) and V_R (ENERGY03 slot 35,
# right for every N) of frame 0, the only frame whose configuration does not depend on those
# forces.
# `aladip_vacuum_eds_pairs_fixed` pins the whole run.
compare = "frame0_eds_states_vr"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
