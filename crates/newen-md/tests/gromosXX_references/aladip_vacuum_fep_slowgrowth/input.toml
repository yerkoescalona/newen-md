# gromosXX md++ 2023-04-15 (native binary), item 1.8
[system]
name = "aladip_vacuum_fep_slowgrowth"
description = "aladip vacuum FEP with slow growth (DLAMT = 2/ps), dH/dlambda every step"
level = 4
isolates = "lambda += DLAMT*dt after every step: lambda-mixed masses, perturbed bonded and nonbonded terms at a moving lambda; the .trg prints the old lambda, the .tre mass the new one"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_fep_slowgrowth.in"
pttopo = "../shared/aladip.pttopo"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"
free_energy = "expected/free_energy.trg"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
