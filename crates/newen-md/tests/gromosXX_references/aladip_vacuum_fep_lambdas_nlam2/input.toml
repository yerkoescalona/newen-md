# gromosXX md++ 2023-04-15 (native binary), item 1.8
[system]
name = "aladip_vacuum_fep_lambdas_nlam2"
description = "aladip vacuum FEP with individual lambdas and lambda exponent 2"
level = 4
isolates = "(1-L)^(n-1) L' factors per kind with n=2 on the nonbonded term"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_fep_lambdas_nlam2.in"
pttopo = "../shared/aladip.pttopo"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"
free_energy = "expected/free_energy.trg"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
