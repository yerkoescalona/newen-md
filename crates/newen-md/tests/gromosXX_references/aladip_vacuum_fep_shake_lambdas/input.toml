# gromosXX md++ 2023-04-15 (native binary), item 1.8
[system]
name = "aladip_vacuum_fep_shake_lambdas"
description = "aladip vacuum FEP, perturbed SHAKE with individual bond lambdas"
level = 4
isolates = "bond individual lambda drives the constraint length and the SHAKE dH/dlambda"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_fep_shake_lambdas.in"
pttopo = "../shared/aladip.pttopo"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"
free_energy = "expected/free_energy.trg"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
