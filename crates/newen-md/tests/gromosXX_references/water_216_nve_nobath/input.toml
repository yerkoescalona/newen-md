# Generated for 3.9 step 0 (assumption A18) with the CODATA-patched gromosXX
# (.local/gromosXX/md++/BUILD/program/md — the same binary as every other reference here).
# Identical to water_216_box except that the MULTIBATH block is ABSENT: gromosXX then runs
# no temperature coupling at all, whereas newen's IMD parser keeps
# TempBathParameters::default() (Berendsen, 300 K, tau 0.1) and silently thermostats.

[system]
name = "water_216_nve_nobath"
description = "Level 3: water_216_box with no MULTIBATH block — absent block must mean no bath"
level = 3
natoms = 648
isolates = "IMD parser: absent optional block vs default values (3.9 A18)"

[input]
topology = "water_216_nve_nobath.topo"
configuration = "water_216_nve_nobath.conf"
parameters = "water_216_nve_nobath.in"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[precision]
internal = "f64"
position_digits = 9
force_digits = 9
energy_sigfigs = 10

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
