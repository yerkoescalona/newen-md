# [provenance] native gromosXX 247c95c4 + D1, D2, D16, D25, D32 patches, binary .local/gromosXX-patched/md++/BUILD/program/md (branch divergences-fix), item 1.8
[system]
name = "aladip_vacuum_aeds_sigma0_fixed"
description = "pins the corrected A-EDS search: aladip vacuum, A-EDS FORM 3, BMAXTYPE 2, EIR -20 0 (state 1 never visited): the default target state 1 has no variance; RESTREMIN 1 clamps E_min to its fake mean 0; expected output from native 247c95c4 + the D16, D25, D32 patches (tests/gromosXX_references/patches/)"
level = 4
isolates = "D32: the sampled state 2, not the never-visited state 1, sets G and sigma_G (BMAXTYPE 2), so E_min is no longer clamped at a fake G = 0; D16"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_aeds_sigma0_fixed.in"
pttopo = "../shared/aladip_aeds2.mpt"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
