# [provenance] native gromosXX 247c95c4 + D41 patch (tests/gromosXX_references/patches/D41_nh_restart.patch), binary .local/gromosXX-patched/md++/BUILD/program/md, item D41
# gromosXX v1.6.0, double precision, 648 atoms

[system]
name = "water_216_nvt_nosehoover"
description = "Level 3: 216 waters, Nose-Hoover thermostat (single NHC, NVT), fresh start (NTINHT 1); expected output from native 247c95c4 + the D41 patch: the final configuration carries the NHCVARIABLES block of plain Nose-Hoover"
level = 3
natoms = 648
isolates = "Nose-Hoover thermostat (algorithm=1, single zeta per bath) and its NHCVARIABLES block (D41)"

[input]
topology = "../water_216_box/water_216_box.topo"
configuration = "../water_216_box/water_216_box.conf"
parameters = "water_216_nvt_nosehoover.in"

[expected]
