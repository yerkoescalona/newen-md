# gromosXX md++ 247c95c4 (native binary .local/gromosXX/md++/BUILD/program/md), item 1.8
[system]
name = "aladip_vacuum_aeds_sigma0"
description = "aladip vacuum, A-EDS FORM 3, BMAXTYPE 2, EIR -20 0 (state 1 never visited): the default target state 1 has no variance; RESTREMIN 1 clamps E_min to its fake mean 0"
level = 4
isolates = "the E_min clamp at G (RESTREMIN 1) with b_max = 0, the state-0 default target (RESTREMIN 0 is refused instead)"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_aeds_sigma0.in"
pttopo = "../shared/aladip_aeds2.mpt"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9

# Recipe fields no .imd block carries, applied by the runners (md @recipe_set key=value,
# Recipe.update in Python): reproduce gromosXX 247c95c4, whose defects this native
# reference pins: the columns after the update (D16), state 1 as the default target (D32).
[recipe_overrides]
"aeds.energy_columns" = "gromosxx-post-update"
"aeds.target_state" = "gromosxx-state1-default"
