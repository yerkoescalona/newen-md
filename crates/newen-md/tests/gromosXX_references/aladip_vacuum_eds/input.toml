# gromosXX md++ 247c95c4 (native binary .local/gromosXX/md++/BUILD/program/md), item 1.8
[system]
name = "aladip_vacuum_eds"
description = "aladip vacuum, EDS FORM 1 (single s 0.5) over two end states of CB, N and H"
level = 4
isolates = "EDS single-s N=2: per-state LJ+RF pairs, 1-4 and RF excluded/self terms, V_R and the mixed forces"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_eds.in"
