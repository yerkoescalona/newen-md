# Expected output from the released gromosXX binary with @develop: gromosXX marks Ewald as
# under development (`in_parameter.cc:4672`, "Ewald sum is under development"), so
# scripts/regen_gromosXX_references.py (which passes no extra flag) cannot regenerate it.
# Generated by hand, in an empty directory, with
#   .local/gromosXX/md++/BUILD/program/md @topo ../nacl_water_box/nacl_water_box.topo \
#     @conf ../nacl_water_box/nacl_water_box.conf @input nacl_water_box_ewald_na2clc1.in \
#     @fin final.conf @tre energies.tre @trf forces.trf @trc trajectory.trc @develop
# and the four output files copied into expected/.
# gromosXX v1.6.0, double precision, 62 atoms. `nacl_water_box` (2.0 nm cube) with the
# lattice-sum parameters of `water_216_box_ewald` (Gaussian a = 0.4 nm, NK 10, KCUT 900 nm^-2),
# atomic cutoff, one energy group, and NA2CLC 1: A2~ as the k-space sum
# (`nonbonded_outerloop.cc`, `ls_a2t_exact`) instead of the Wigner constant of the cube.

[system]
name = "nacl_water_box_ewald_na2clc1"
description = "Level 2: Na+ Cl- + 20 SPC waters in PBC, direct Ewald sum (NLRELE 2) with NA2CLC 1"
level = 2
natoms = 62
isolates = "Ewald A2~ from the k-space sum (NA2CLC 1)"

[input]
topology = "../nacl_water_box/nacl_water_box.topo"
configuration = "../nacl_water_box/nacl_water_box.conf"
parameters = "nacl_water_box_ewald_na2clc1.in"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[precision]
internal = "f64"
position_digits = 9
force_digits = 9
energy_sigfigs = 10

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
