description = "nacl_water_fep_precalc with the Na-Cl pair a 1-4 pair (shared/nacl_water_box_14.topo)"
level = 4
isolates = "charge-changing perturbation: the perturbed 1-4 pair (CS6/CS12), its dH/dlambda and ext rows at 11 lambdas, the RF self term"

[input]
