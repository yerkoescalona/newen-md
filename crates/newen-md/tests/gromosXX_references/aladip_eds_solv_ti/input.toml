# gromosXX md++ 247c95c4 (native binary .local/gromosXX/md++/BUILD/program/md), item 1.8
[system]
name = "aladip_eds_solv_ti"
description = "aladip in 20 SPC, EDS FORM 1 over two end states of N4 and H11 with perturbed atoms CB1, C8, N10, CB12 at RLAM 0.3 (TI-EDS), one energy group"
level = 4
isolates = "TI-EDS: the EDS-perturbed soft-core pairs per state (pairlist both index orders, 1-4, RF-excluded), dV_i/dlambda in the # eds rows and Sum p_i dV_i/dlambda in slot 35 of the .trg"

[input]
topology = "../shared/aladip.topo"
configuration = "../shared/aladip.conf"
parameters = "aladip_eds_solv_ti.in"
pttopo = "aladip_eds_solv_ti.ptp"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"
free_energy = "expected/free_energy.trg"

[tolerances]
# newen's EDS atom owns every EDS-perturbed pair, gromosXX's perturbed atom owns the 1-4 and
# excluded ones: same terms, different summation order
force_abs = 1e-8
energy_rel = 1e-10
position_abs = 1e-9
