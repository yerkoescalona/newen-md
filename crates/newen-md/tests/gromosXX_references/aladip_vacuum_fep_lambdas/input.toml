# gromosXX md++ 2023-04-15 (native binary), item 1.8
[system]
name = "aladip_vacuum_fep_lambdas"
description = "aladip vacuum FEP with individual lambdas per interaction and group pair"
level = 4
isolates = "LAMBDAS polynomials for bond/angle/dihedral/improper/mass on (1,1),(2,2) and vdw/crf(+soft) on (1,1),(1,2),(2,2)"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_fep_lambdas.in"
pttopo = "../shared/aladip.pttopo"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"
free_energy = "expected/free_energy.trg"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
