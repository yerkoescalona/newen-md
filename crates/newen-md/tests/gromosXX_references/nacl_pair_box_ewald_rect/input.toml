# Expected output from the released gromosXX binary with @develop: gromosXX marks Ewald as
# under development (`in_parameter.cc:4672`, "Ewald sum is under development"), so
# scripts/regen_gromosXX_references.py (which passes no extra flag) cannot regenerate it.
# Generated by hand, in an empty directory, with
#   .local/gromosXX/md++/BUILD/program/md @topo ../nacl_pair_box/nacl_pair_box.topo \
#     @conf nacl_pair_box_ewald_rect.conf @input nacl_pair_box_ewald_rect.in @fin final.conf \
#     @tre energies.tre @trf forces.trf @trc trajectory.trc @develop
# and the four output files copied into expected/.
# gromosXX v1.6.0, double precision, 2 atoms. `nacl_pair_box_ewald` in a rectangular
# 2.0 x 2.2 x 2.4 nm box with the pair off every axis, so A2 (NA2CLC 2) is summed over shells
# until TOLA2 is met instead of taken from the Wigner constant of the cube. KCUT = 900 nm^-2 is
# compared with |k|^2: NKX, NKY, NKZ = 10, 11, 12 keep every l inside the sphere of radius
# 30 L_i / (2 pi) (9.5, 10.5, 11.5), where exp(-a^2 k^2 / 4) < 3e-16. Cutoff 0.9 nm, below half
# the smallest edge.

[system]
name = "nacl_pair_box_ewald_rect"
description = "Level 1: Na+ Cl- in a rectangular PBC box, direct Ewald sum (NLRELE 2)"
level = 1
natoms = 2
isolates = "Ewald A2 summed over shells in a non-cubic box (NA2CLC 2)"

[input]
topology = "../nacl_pair_box/nacl_pair_box.topo"
configuration = "nacl_pair_box_ewald_rect.conf"
parameters = "nacl_pair_box_ewald_rect.in"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[precision]
internal = "f64"
position_digits = 9
force_digits = 9
energy_sigfigs = 10

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
