# gromosXX md++ 2023-04-15 (native binary), item 1.8
[system]
name = "aladip_solvated_epsrf0"
description = "aladip solvated with EPSRF 0"
level = 3
isolates = "the EPSRF=0 reaction-field constant (gromosXX crf = -1)"

[input]
topology = "../shared/aladip.topo"
configuration = "../shared/aladip.conf"
parameters = "aladip_solvated_epsrf0.in"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
