# [provenance] native gromosXX 247c95c4 + D1, D2, D16, D25, D32 patches, binary .local/gromosXX-patched/md++/BUILD/program/md (branch divergences-fix), item 1.8
[system]
name = "aladip_vacuum_aeds_f6_ovf_fixed"
description = "pins the corrected A-EDS search: aladip vacuum, A-EDS FORM 6 over the three gentle end states of aladip_aeds3.mpt with EIR 0 6000 0, 100 steps from Maxwell-Boltzmann velocities: V_2 - E_2^R is about -4000 kJ/mol, e^{-beta(V_2 - E_2^R)} overflows, the prevalences are NaN and gromosXX moves no offset after the centring of step 0 (-2000, 4000, -2000); expected output from native 247c95c4 + the D16, D25, D32 patches (tests/gromosXX_references/patches/)"
level = 4
isolates = "D25: e^{-beta(V_2 - E_2^R)} overflows every step; the log-sum-exp prevalences keep the offset search moving where the released binary freezes it"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_aeds_f6_ovf_fixed.in"
pttopo = "../shared/aladip_aeds3.mpt"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
