# [provenance] native gromosXX 247c95c4 + D1, D2, D16, D25, D32 patches, binary .local/gromosXX-patched/md++/BUILD/program/md (branch divergences-fix), item 1.8
[system]
name = "aladip_vacuum_aeds_f4_fixed"
description = "pins the corrected A-EDS search: aladip vacuum, A-EDS FORM 4 (offsets, E_max and E_min searched), RESTREMIN 1, BMAXTYPE 1: all four E_min branches, 16 round trips over three end states of N and H (aladip_aeds3.mpt), EIR 0 0 -3, 300 steps from Maxwell-Boltzmann velocities; expected output from native 247c95c4 + the D16, D25, D32 patches (tests/gromosXX_references/patches/)"
level = 4
isolates = "D16: E_max, E_min, E^R columns before the update; D32: G from a sampled state"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_aeds_f4_fixed.in"
pttopo = "../shared/aladip_aeds3.mpt"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
