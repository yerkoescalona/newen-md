[package]
name = "newen-md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "newen simulation engines (md, remd, gamd)"
# Binaries are declared explicitly: `src/bin/mdf.rs` is a mean-force utility, not gromos++'s
# `mdf` (the minimum-distance program, ported in newen-analysis), and two crates producing a
# binary of the same name overwrite each other in `target/<profile>/`.
autobins = false

[dependencies]
newen = { workspace = true }
newen-core = { workspace = true }
newen-forces = { workspace = true }
newen-integrators = { workspace = true }
newen-io = { workspace = true }
# The one run builder (3.9): prepare_system / build_sequence_from_imd / start
newen-run = { workspace = true }
# Output steps and the minimisation stop, checked against a Lean model
newen-logic = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# CLI
clap = { workspace = true }

# Parallelism
rayon = { workspace = true }

# Random number generation
rand = { workspace = true }
rand_distr = { workspace = true }

# MPI support (optional)
mpi = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

# CUDA support (optional)
cudarc = { workspace = true, optional = true }

[features]
default = []
use-mpi = ["mpi", "libc", "newen-forces/use-mpi"]
use-cuda = ["cudarc"]
ml = ["newen-forces/ml", "newen-run/ml"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "md_bench"
harness = false

[[bin]]
name = "md"
path = "src/bin/md.rs"

[[bin]]
name = "remd"
path = "src/bin/remd.rs"

[[bin]]
name = "gamd"
path = "src/bin/gamd.rs"

# gromos++'s `mdf` is the minimum-distance program (newen-analysis); this one computes a mean
# force along a reaction coordinate, so it carries its own name.
[[bin]]
name = "mean_force"
path = "src/bin/mdf.rs"
