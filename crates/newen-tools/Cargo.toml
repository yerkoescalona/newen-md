[package]
name = "newen-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "newen system construction and preparation tools"
autobins = false

[features]
use-mpi = []

[dependencies]
newen = { workspace = true }
newen-core = { workspace = true }
newen-io = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# CLI
clap = { workspace = true }

# ── Topology construction ──────────────────────────────────────────

[[bin]]
name = "make_top"
path = "src/bin/topology/make_top.rs"

[[bin]]
name = "com_top"
path = "src/bin/topology/com_top.rs"

[[bin]]
name = "con_top"
path = "src/bin/topology/con_top.rs"

[[bin]]
name = "link_top"
path = "src/bin/topology/link_top.rs"

[[bin]]
name = "red_top"
path = "src/bin/topology/red_top.rs"

[[bin]]
name = "check_top"
path = "src/bin/topology/check_top.rs"

[[bin]]
name = "addvirt_top"
path = "src/bin/topology/addvirt_top.rs"

[[bin]]
name = "pert_top"
path = "src/bin/topology/pert_top.rs"

[[bin]]
name = "make_pt_top"
path = "src/bin/topology/make_pt_top.rs"

[[bin]]
name = "top2build"
path = "src/bin/topology/top2build.rs"

# ── Box / coordinate preparation ──────────────────────────────────

[[bin]]
name = "build_box"
