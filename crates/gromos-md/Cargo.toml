[package]
name = "gromos-md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "GROMOS-RS simulation engines (md, remd, gamd)"
# Binaries are declared explicitly: `src/bin/mdf.rs` is a mean-force utility, not gromos++'s
# `mdf` (the minimum-distance program, ported in gromos-analysis), and two crates producing a
# binary of the same name overwrite each other in `target/<profile>/`.
autobins = false

[dependencies]
gromos = { workspace = true }
gromos-core = { workspace = true }
gromos-forces = { workspace = true }
gromos-integrators = { workspace = true }
gromos-io = { workspace = true }
# The one run builder (3.9): prepare_system / build_sequence_from_imd / start
gromos-run = { workspace = true }

# Logging
log = { workspace = true }
env_logger = { workspace = true }

# CLI
clap = { workspace = true }

# Parallelism
rayon = { workspace = true }

# Random number generation
rand = { workspace = true }
rand_distr = { workspace = true }

# MPI support (optional)
mpi = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

# CUDA support (optional)
cudarc = { workspace = true, optional = true }

[features]
default = []
use-mpi = ["mpi", "libc", "gromos-forces/use-mpi"]
use-cuda = ["cudarc"]
ml = ["gromos-forces/ml", "gromos-run/ml"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "md_bench"
harness = false

[[bin]]
name = "md"
path = "src/bin/md.rs"

[[bin]]
name = "remd"
path = "src/bin/remd.rs"

[[bin]]
name = "gamd"
path = "src/bin/gamd.rs"

# gromos++'s `mdf` is the minimum-distance program (gromos-analysis); this one computes a mean
# force along a reaction coordinate, so it carries its own name.
[[bin]]
name = "mean_force"
path = "src/bin/mdf.rs"
