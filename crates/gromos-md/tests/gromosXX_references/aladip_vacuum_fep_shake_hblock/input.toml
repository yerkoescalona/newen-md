# gromosXX md++ 2023-04-15 (native binary), item 1.8
[system]
name = "aladip_vacuum_fep_shake_hblock"
description = "aladip vacuum FEP, perturbed SHAKE with H and non-H perturbed bond blocks sharing an atom and a group-2 bond that changes length"
level = 4
isolates = "PERTBONDSTRETCHH before PERTBONDSTRETCH in the SHAKE order; group-2 bond lambda and its constraint dH/dlambda"

[input]
topology = "../shared/aladip.topo"
configuration = "../aladip_vacuum/aladip_vacuum.conf"
parameters = "aladip_vacuum_fep_shake_hblock.in"
pttopo = "../shared/aladip_hblock.pttopo"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"
free_energy = "expected/free_energy.trg"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
