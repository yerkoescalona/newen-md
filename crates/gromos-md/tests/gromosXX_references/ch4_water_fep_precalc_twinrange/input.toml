# gromosXX md++ 2023-04-15 (native binary), item 1.8
[system]
name = "ch4_water_fep_precalc_twinrange"
description = "CH4 in water, PRECALCLAM with a twin-range pairlist refreshed every 5 steps and output every 2"
level = 4
isolates = "long-range ext energies computed only on pairlist steps that are also output steps (gromosXX quirk)"

[input]
topology = "../shared/ch4_spc.top"
configuration = "../shared/ch4_spc.cnf"
parameters = "ch4_water_fep_precalc_twinrange.in"
pttopo = "../shared/ch4_spc_dummy.ptp"

[expected]
forces = "expected/forces.trf"
energies = "expected/energies.tre"
trajectory = "expected/trajectory.trc"
final_conf = "expected/final.conf"
free_energy = "expected/free_energy.trg"

[tolerances]
force_abs = 1e-6
energy_rel = 1e-8
position_abs = 1e-9
