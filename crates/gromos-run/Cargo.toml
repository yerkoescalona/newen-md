[package]
name = "gromos-run"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Run assembly for GROMOS-RS: RunRecipe (a .imd as data) + topology + coordinates -> plan -> AlgorithmSequence. The one builder shared by the md binary and py-gromos (3.9)."

[dependencies]
gromos-core = { workspace = true }
# `serde`: the recipe carries `AtomPairKernel`
gromos-forces = { workspace = true, features = ["serde"] }
# `serde`: the plan carries `BathRange` (the DOFSET ranges) as data
gromos-integrators = { workspace = true, features = ["serde"] }
gromos-io = { workspace = true }

# The recipe and the plan are plain data: serde is the Rust<->Python bridge (3.9 A12),
# TOML the human-readable echo (`<run>.recipe.toml`), JSON the machine dump (`md @dump`).
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[features]
default = []
ml = ["gromos-forces/ml"]
