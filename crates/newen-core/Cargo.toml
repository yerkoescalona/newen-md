[package]
name = "newen-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core types and math primitives for newen molecular dynamics"

[dependencies]
# Integer decision logic with a Lean specification (pair kinds, PRECALCLAM step schedules)
newen-logic = { workspace = true }

# SIMD and math
glam = { workspace = true }
wide = { workspace = true }

# Logging
log = { workspace = true }

# Parallelism
rayon = { workspace = true }

# Serialization
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]
ffi = []

[dev-dependencies]
approx = "0.5"
criterion = { workspace = true }

[[bench]]
name = "math_bench"
harness = false
