name: Test Rust

on:
  push:
    branches:
      - main
      - develop
      - ci
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-rust.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # .cargo/config.toml compiles with `-C target-cpu=native`, which is right on one
  # machine and wrong across a fleet: GitHub runners differ in CPU, and an artefact or
  # proc-macro dylib built on one and restored from cache on another dies with SIGILL.
  # RUSTFLAGS overrides the config file, so CI builds portable code.
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  test:
    name: Test Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Unix only. gromos++ names output files after atom specifiers (`MIN_1:1.dat`), and
        # `:` cannot exist in a Windows filename, so a faithful port cannot run there.
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: nightly
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenmpi-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install fftw open-mpi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-v2-${{ hashFiles('**/Cargo.toml', '**/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-v2-

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features --all-targets -- -W warnings -A clippy::upper_case_acronyms -A non_snake_case
        continue-on-error: true

      - name: Build (all features)
        run: cargo build --workspace --all-features
        continue-on-error: true

      - name: Test (all features)
        run: cargo test --workspace --all-features -- --nocapture
        continue-on-error: true

      - name: Test (release mode)
        run: cargo test --workspace --all-features --release
        continue-on-error: true

      - name: Doc tests
        run: cargo test --doc --workspace
        continue-on-error: true

  test-features:
    name: Test Feature Combinations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--features simd"
          - "--features use-fftw"
          - "--all-features"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenmpi-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-features-v2-${{ hashFiles('**/Cargo.toml', '**/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-features-v2-

      - name: Test with features
        run: cargo test --workspace ${{ matrix.features }}
        continue-on-error: true

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-v2-${{ hashFiles('**/Cargo.toml', '**/rust-toolchain.toml') }}

      - name: Run benchmarks
        run: cargo bench --workspace --no-fail-fast || echo "Benchmarks not yet available"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # Cargo.lock is not tracked, and cargo audit reads one.
      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Run security audit
        run: cargo audit
