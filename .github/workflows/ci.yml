name: CI

on:
  push:
    branches:
      - main
      - develop
      - ci
  pull_request:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # .cargo/config.toml compiles with `-C target-cpu=native`, which is right on one
  # machine and wrong across a fleet: GitHub runners differ in CPU, and an artefact or
  # proc-macro dylib built on one and restored from cache on another dies with SIGILL.
  # RUSTFLAGS overrides the config file, so CI builds portable code.
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: make fmt-check
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies
        working-directory: py-newen
        run: uv sync --all-groups

      - name: Check Python formatting
        working-directory: py-newen
        run: |
          uv run ruff check python/ tests/
          uv run ruff format --check python/ tests/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenmpi-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-v2-${{ hashFiles('**/Cargo.toml', '**/rust-toolchain.toml') }}

      - name: Clippy (Rust)
        run: make lint-rust
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies
        working-directory: py-newen
        run: uv sync --all-groups

      - name: Lint Python
        working-directory: py-newen
        run: uv run ruff check python/ tests/

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: always()
    needs: [format-check, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenmpi-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-integration-v2-${{ hashFiles('**/Cargo.toml', '**/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-v2-

      - name: Run Rust tests
        run: cargo test --workspace --all-features
        continue-on-error: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies (builds extension via maturin)
        working-directory: py-newen
        run: uv sync --all-groups
        continue-on-error: true

      - name: Run Python tests
        working-directory: py-newen
        run: uv run pytest tests/ -v
        continue-on-error: true

  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    if: always()
    needs: test-integration
    strategy:
      fail-fast: false
      matrix:
        # Unix only — see the note in test-rust.yml.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenmpi-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install fftw open-mpi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-v2-${{ hashFiles('**/Cargo.toml', '**/rust-toolchain.toml') }}

      - name: Build Rust release (all features)
        run: cargo build --release --workspace --all-features
        continue-on-error: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install maturin
        run: uv pip install --system maturin

      - name: Build Python wheel (all features)
        working-directory: py-newen
        run: maturin build --release --features newen/use-mpi
        continue-on-error: true

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: py-newen/target/wheels/*.whl

  test-notebooks:
    name: Test Notebooks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenmpi-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies (builds extension via maturin)
        working-directory: py-newen
        run: uv sync --all-groups

      - name: Test notebooks
        working-directory: py-newen
        run: |
          cd notebooks
          for notebook in *.ipynb; do
            echo "Testing $notebook..."
            uv run jupyter nbconvert --to notebook --execute "$notebook" --output temp.ipynb || exit 1
            rm temp.ipynb
          done

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenmpi-dev

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate Rust coverage
        # --all-features is intentionally excluded: gpu/mpi/fftw modules are stubs
        # not yet ready for compilation. Coverage runs default features only.
        run: cargo llvm-cov --workspace --lcov --output-path ./lcov-rust.info

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies (builds extension via maturin)
        working-directory: py-newen
        run: uv sync --all-groups

      - name: Generate Python coverage
        working-directory: py-newen
        run: uv run pytest tests/ --cov=newen --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov-rust.info,./py-newen/coverage.xml
          flags: integration
          name: full-coverage
