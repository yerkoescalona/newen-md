name: Test Python

on:
  push:
    branches:
      - main
      - develop
      - ci
    paths:
      - 'py-newen/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-python.yml'
  pull_request:
    paths:
      - 'py-newen/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-python.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # .cargo/config.toml compiles with `-C target-cpu=native`, which is right on one
  # machine and wrong across a fleet: GitHub runners differ in CPU, and an artefact or
  # proc-macro dylib built on one and restored from cache on another dies with SIGILL.
  # RUSTFLAGS overrides the config file, so CI builds portable code.
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  test:
    name: Test Python (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Unix only — see the note in test-rust.yml.
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenmpi-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install fftw open-mpi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-python-v2-${{ hashFiles('**/Cargo.toml', '**/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-v2-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies (builds extension via maturin)
        working-directory: py-newen
        run: uv sync --all-groups

      - name: Lint and format Python code (ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        working-directory: py-newen
        run: |
          uv run ruff check python/ tests/
          uv run ruff format --check python/ tests/

      - name: Clippy (Rust bindings)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        working-directory: py-newen
        run: cargo clippy --all-targets -- -W warnings
        continue-on-error: true

      - name: Run Python tests
        working-directory: py-newen
        run: uv run pytest tests/ -v
        continue-on-error: true

      - name: Run Python tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        working-directory: py-newen
        run: uv run pytest tests/ --cov=newen --cov-report=xml --cov-report=term
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: py-newen/coverage.xml
          flags: python
          name: python-${{ matrix.python-version }}
        continue-on-error: true

  test-import:
    name: Test Import Without Dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenmpi-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-import-v2-${{ hashFiles('**/Cargo.toml', '**/rust-toolchain.toml') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

      # Deliberately just maturin + numpy (the runtime dep), not `uv sync
      # --all-groups` — this job checks the extension imports on its own,
      # without the dev tooling present.
      - name: Install maturin
        run: uv pip install maturin numpy

      # A wheel, not `maturin develop`: develop installs the pyproject's dependency
      # groups (PEP 735) through `pip install --group`, which needs pip >= 25.1 — newer
      # than the pip a venv gets from ensurepip here — and would pull in the very dev
      # tooling this job exists to do without. Debug on purpose: whether the extension
      # imports is not a question an optimised build answers any better.
      - name: Build and install py-newen
        working-directory: py-newen
        run: |
          maturin build --out dist
          uv pip install --no-deps dist/*.whl

      - name: Test import
        run: |
          python -c "import newen; print(f'newen version: {newen.__version__}')"

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev libopenmpi-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies (builds extension via maturin)
        working-directory: py-newen
        run: uv sync --all-groups

      - name: Run benchmarks
        working-directory: py-newen
        run: uv run pytest tests/ --benchmark-only || echo "No benchmarks available"
