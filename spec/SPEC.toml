key = "periodicity.triclinic_new"
kind = "float"
rust = "crates/newen-core/src/math.rs::Triclinic::new"
used_by = ["crates/newen-run/src/build.rs", "crates/newen-run/src/legacy_builder.rs", "crates/newen-run/src/prepare.rs"]
origin = "glam 0.24 DMat3::inverse (cross products over the determinant, transposed); gromosXX stores the scaled cross products instead (boundary_implementation.cc:72-82)"
# Theorem over R: the inverse applied to r gives the fractional coordinates of a lower-triangular box
theory = "NewenTheory.Space.Periodicity.Box.frac"
model = "NewenSpec.Periodicity.inverseModel (at Float: triclinicNewFloat)"
theorem = "NewenSpec.Periodicity.mulVec_inverseModel_real"
# Rust = model at Float, bit for bit on the generated rows, general and singular matrices included (cargo test)
differential = "crates/newen-core/tests/periodicity_spec.rs"
vectors = "spec/vectors/periodicity.json"

[[function]]
key = "periodicity.triclinic_nearest_image"
kind = "float"
rust = "crates/newen-core/src/math.rs::triclinic_nearest_image"
used_by = ["crates/newen-core/src/math.rs::Triclinic::nearest_image (through Periodicity::nearest_image; triclinic and truncated-octahedron boxes)"]
origin = "gromosXX Boundary_Implementation<triclinic>::nearest_image (boundary_implementation.cc:277-318), loop for loop and operation for operation"
# Theorems over R: lattice, in the centred cell (fractional coordinates in (-1/2, 1/2]), unique, idempotent; not always the shortest image (image_not_shortest)
theory = "NewenTheory.Space.Periodicity.Box.image (image_lattice, image_inCell, inCell_unique, image_eq_of, image_idem, image_not_shortest)"
model = "NewenSpec.Periodicity.triclinicNearestImageModel (at Float: triclinicNearestImageFloat, fuel 100000)"
theorem = "NewenSpec.Periodicity.triclinicNearestImageModel_real_eq (triclinicNearestImageModel_real_idem), for lower-triangular boxes and fuel above every fractional coordinate plus one"
# Rust = model at Float, bit for bit on the generated rows (rectangular, truncated-octahedron, reduced, skewed and monoclinic boxes) (cargo test)
differential = "crates/newen-core/tests/periodicity_spec.rs"
vectors = "spec/vectors/periodicity.json"

[[function]]
key = "periodicity.triclinic_put_into_box"
kind = "float"
rust = "crates/newen-core/src/math.rs::triclinic_put_into_box"
used_by = ["crates/newen-core/src/math.rs::Triclinic::put_into_box (through Periodicity::put_into_box: crates/newen-integrators/src/algorithms/lattice_shift.rs)"]
origin = "newen's positive cell (fractional coordinates in [0, 1)); gromosXX's put_into_box is the triclinic nearest image of the origin"
# Theorems over R: lattice, in the positive cell, idempotent; the model at R is Box.wrap
theory = "NewenTheory.Space.Periodicity.Box.wrap (wrap_lattice, wrap_inPositiveCell, wrap_eq_of, wrap_idem)"
model = "NewenSpec.Periodicity.triclinicPutIntoBoxModel (at Float: triclinicPutIntoBoxFloat)"
theorem = "NewenSpec.Periodicity.triclinicPutIntoBoxModel_real_eq"
# Rust = model at Float, bit for bit on the generated rows (cargo test)
differential = "crates/newen-core/tests/periodicity_spec.rs"
vectors = "spec/vectors/periodicity.json"
