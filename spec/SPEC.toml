[[function]]
key = "thermostat.berendsen_scale"
kind = "float"
rust = "crates/newen-integrators/src/algorithms/berendsen_thermostat.rs::berendsen_scale"
used_by = ["crates/newen-integrators/src/algorithms/berendsen_thermostat.rs::BerendsenThermostat::apply"]
origin = "gromosXX Berendsen_Thermostat::calc_scaling (berendsen_thermostat.cc:95-135); tau = 0 is instantaneous scaling, which gromosXX does only through its `immediate` argument (a tau of 0 there divides by zero)"
# Theorems over R: the theory's meaning, and the model at R equal to it once the fallbacks are ruled out
theory = "NewenTheory.Dynamics.Thermostats.berendsenScale (berendsen_relax, berendsen_fixed, berendsen_between, berendsen_contraction)"
model = "NewenSpec.Thermostat.berendsenModel (at Float: berendsenFloat)"
theorem = "NewenSpec.Thermostat.berendsenModel_real_eq (berendsenModel_real_instant, berendsenModel_uncoupled)"
# Rust = model at Float, bit for bit on the generated rows (cargo test)
differential = "crates/newen-integrators/tests/thermostat_spec.rs"
vectors = "spec/vectors/thermostat.json"

