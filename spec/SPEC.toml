origin = "gromosXX Nonbonded_Term::lj_crf_interaction (nonbonded_term.cc:219-248); gromosXX's LJ force is (c12/r^6 + c12/r^6 - c6) * 6 / r^6 / r^2, newen's (12 c12/r^6 - 6 c6) / r^6 / r^2 (last-bit differences); the guard r^2 < 1e-10 is newen's"
