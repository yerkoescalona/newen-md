[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "newen"
# maturin takes the version from py-newen/Cargo.toml, i.e. the workspace version.
dynamic = ["version"]
description = "Python bindings for newen molecular dynamics engine"
authors = [
    {name = "Yerko Escalona"}
]
readme = "README.md"
license = {text = "GPL-2.0"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
# `newen.education`: the live viewer (anywidget) and the experiment plots (matplotlib).
education = ["anywidget>=0.9", "matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    # `uv run maturin develop` builds the extension into this venv; a sync without it in the
    # lock uninstalls it.
    "maturin>=1.0,<2.0",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "plotly>=5.24",
    "polars>=1.0",
    "nbstripout>=0.7",
    "anywidget>=0.9",
]
# Real ML potential (--features ml on the Rust side): SchNetPack via TorchScript/`tch`.
# Version-pinned exactly — tch 0.24.0 links only against libtorch 2.11.0 (see
# crates/newen-forces/src/nonbonded/schnet.rs). `uv sync --group ml` gives a reproducible
# CPU-wheel venv in place of hand-building a throwaway /tmp/torch_venv.
ml = [
    "torch==2.11.0",
    "schnetpack>=2.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Homepage = "https://github.com/yerkoescalona/newen-md"
Repository = "https://github.com/yerkoescalona/newen-md"
Documentation = "https://github.com/yerkoescalona/newen-md/tree/main/py-newen/docs"

[tool.maturin]
python-source = "python"
module-name = "newen"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: marks tests as benchmarks",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "error",
    # Allow some specific warnings
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["newen"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "target",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    # Naming conventions - allow scientific notation (kT, pH, deltaG, etc.)
    "N801",  # class names
    "N802",  # function names
    "N803",  # argument names
    "N806",  # variable names in functions
    "N815",  # mixed case variable in class scope
    "N816",  # mixed case variable in global scope
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",  # Unused function args in tests
    "S101", # Use of assert detected
]
# A design sketch: minimize() and equilibrate() raise NotImplementedError, so the
# parameters that are the point of the sketch read as unused.
"python/newen/system_builder.py" = ["ARG002"]
[tool.ruff.lint.isort]
known-first-party = ["newen"]

[tool.ruff.format]
# Use ruff's formatter (compatible with black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["numpy.*", "pytest.*"]
ignore_missing_imports = true
